      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparer l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/QuartHome.apk
          ls -lh out/

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/QuartHome.apk \
            --title "Quart Home - dernier build" \
            --notes "Build #${{ github.run_number }}. Telecharge QuartHome.apk ci-dessous et installe-le."
