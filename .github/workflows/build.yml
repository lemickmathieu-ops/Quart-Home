name: Quart Home - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project structure
        run: |
          mkdir -p app/src/main/java/com/quart/home
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

      - name: Create gradle files
        run: |
          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "QuartHome"
          include(":app")
          GRADLE

          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          GRADLE

          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.quart.home"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.quart.home"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          GRADLE

      - name: Create manifests and resources
        run: |
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Quart Home"
                  android:theme="@style/Theme.QuartHome">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:excludeFromRecents="true"
                      android:configChanges="keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/values/themes.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.QuartHome" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowShowWallpaper">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
              </style>
          </resources>
          XML

          cat > app/src/main/res/values/colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FF5B4DFF</color>
          </resources>
          XML

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M34,34h16v16h-16z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M58,34h16v16h-16z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M34,58h16v16h-16z" />
              <path android:fillColor="#FFFFD166" android:pathData="M58,58h16v16h-16z" />
          </vector>
          XML

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Create data layer
        run: |
          D=app/src/main/java/com/quart/home

          cat > $D/AppEntry.kt <<'KT'
          package com.quart.home
          import android.content.ComponentName
          import android.os.UserHandle
          import androidx.compose.ui.graphics.ImageBitmap
          data class AppEntry(
              val label: String,
              val packageName: String,
              val componentName: ComponentName,
              val user: UserHandle,
              val icon: ImageBitmap?
          ) {
              val key: String get() = componentName.flattenToShortString() + "|" + user.hashCode()
          }
          KT

          cat > $D/AppRepository.kt <<'KT'
          package com.quart.home
          import android.content.Context
          import android.content.pm.LauncherApps
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import android.os.Process
          import android.os.UserManager
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          class AppRepository(context: Context) {
              private val launcherApps = context.getSystemService(Context.LAUNCHER_APPS_SERVICE) as LauncherApps
              private val userManager = context.getSystemService(Context.USER_SERVICE) as UserManager
              private val iconSizePx: Int = (52 * context.resources.displayMetrics.density).toInt().coerceIn(96, 192)
              suspend fun loadApps(): List<AppEntry> = withContext(Dispatchers.IO) {
                  val profiles = runCatching { userManager.userProfiles }.getOrNull()?.takeIf { it.isNotEmpty() } ?: listOf(Process.myUserHandle())
                  profiles.flatMap { user ->
                      runCatching { launcherApps.getActivityList(null, user) }.getOrNull().orEmpty()
                          .mapNotNull { info -> runCatching { AppEntry(info.label?.toString()?.takeIf { it.isNotBlank() } ?: info.applicationInfo.packageName, info.applicationInfo.packageName, info.componentName, user, info.getBadgedIcon(0)?.toImageBitmap()) }.getOrNull() }
                  }.distinctBy { it.key }.sortedBy { it.label.lowercase() }
              }
              fun launch(entry: AppEntry): Boolean = runCatching { launcherApps.startMainActivity(entry.componentName, entry.user, null, null); true }.getOrDefault(false)
              fun openAppInfo(entry: AppEntry): Boolean = runCatching { launcherApps.startAppDetailsActivity(entry.componentName, entry.user, null, null); true }.getOrDefault(false)
              private fun Drawable.toImageBitmap(): ImageBitmap {
                  val bmp = Bitmap.createBitmap(iconSizePx, iconSizePx, Bitmap.Config.ARGB_8888)
                  Canvas(bmp).apply { setBounds(0, 0, iconSizePx, iconSizePx); this@toImageBitmap.draw(this) }
                  return bmp.asImageBitmap()
              }
          }
          KT

          cat > $D/LayoutModels.kt <<'KT'
          package com.quart.home

          data class FolderData(
              var name: String,
              var color: Long,
              val apps: MutableList<String> = mutableListOf()
          )

          data class LayoutData(
              val order: MutableList<String> = mutableListOf(),
              val folders: MutableMap<String, FolderData> = mutableMapOf(),
              val dismissedSuggestions: MutableSet<String> = mutableSetOf()
          )

          sealed class HomeItem {
              abstract val id: String
              data class AppSlot(val app: AppEntry) : HomeItem() {
                  override val id: String get() = app.key
              }
              data class FolderSlot(val folderId: String, val data: FolderData, val previewApps: List<AppEntry>) : HomeItem() {
                  override val id: String get() = "folder:" + folderId
              }
          }

          data class Suggestion(val label: String, val color: Long, val appKeys: List<String>)
          KT

          cat > $D/LayoutStore.kt <<'KT'
          package com.quart.home
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          class LayoutStore(context: Context) {
              private val file = File(context.filesDir, "quart_layout.json")

              fun load(): LayoutData {
                  return runCatching {
                      if (!file.exists()) return LayoutData()
                      val json = JSONObject(file.readText())
                      val order = mutableListOf<String>()
                      json.optJSONArray("order")?.let { arr ->
                          for (i in 0 until arr.length()) order.add(arr.getString(i))
                      }
                      val folders = mutableMapOf<String, FolderData>()
                      json.optJSONObject("folders")?.let { foldersJson ->
                          foldersJson.keys().forEach { key ->
                              val f = foldersJson.getJSONObject(key)
                              val apps = mutableListOf<String>()
                              f.optJSONArray("apps")?.let { arr -> for (i in 0 until arr.length()) apps.add(arr.getString(i)) }
                              folders[key] = FolderData(f.optString("name", "Dossier"), f.optLong("color", 0xFF5B4DFF), apps)
                          }
                      }
                      val dismissed = mutableSetOf<String>()
                      json.optJSONArray("dismissed")?.let { arr -> for (i in 0 until arr.length()) dismissed.add(arr.getString(i)) }
                      LayoutData(order, folders, dismissed)
                  }.getOrDefault(LayoutData())
              }

              fun save(data: LayoutData) {
                  runCatching {
                      val json = JSONObject()
                      json.put("order", JSONArray(data.order))
                      val foldersJson = JSONObject()
                      data.folders.forEach { (id, f) ->
                          val fj = JSONObject()
                          fj.put("name", f.name)
                          fj.put("color", f.color)
                          fj.put("apps", JSONArray(f.apps))
                          foldersJson.put(id, fj)
                      }
                      json.put("folders", foldersJson)
                      json.put("dismissed", JSONArray(data.dismissedSuggestions))
                      file.writeText(json.toString())
                  }
              }
          }
          KT

          cat > $D/CategoryHeuristics.kt <<'KT'
          package com.quart.home

          private val CATEGORY_KEYWORDS: List<Pair<String, List<String>>> = listOf(
              "IA" to listOf("chatgpt", "gpt", "gemini", "copilot", "claude", "perplexity", "assistant ia", " ia", "ai chat"),
              "Reseaux sociaux" to listOf("facebook", "instagram", "twitter", "tiktok", "snapchat", "messenger", "telegram", "discord", "reddit", "pinterest", "linkedin", "threads", "bluesky"),
              "Musique" to listOf("spotify", "musique", "music", "deezer", "soundcloud", "tidal", "shazam"),
              "Video" to listOf("netflix", "video", "prime video", "disney", "youtube", "twitch", "crunchyroll", "hbo"),
              "Finance" to listOf("banque", "bank", "wallet", "paypal", "revolut", "finance", "crypto", "wise"),
              "Magasinage" to listOf("amazon", "shop", "boutique", "aliexpress", "ebay", "etsy", "wish", "shein"),
              "Photo" to listOf("camera", "photo", "galerie", "gallery", "lightroom", "vsco", "snapseed"),
              "Voyage" to listOf("maps", "plans", "voyage", "travel", "booking", "airbnb", "uber", "lyft", "trainline", "skyscanner"),
              "Jeux" to listOf("jeu", "game", "games"),
              "Productivite" to listOf("office", "docs", "notes", "calendrier", "calendar", "drive", "onedrive", "dropbox", "slack", "teams", "zoom", "meet")
          )

          fun guessCategory(entry: AppEntry): String? {
              val label = entry.label.lowercase()
              for (pair in CATEGORY_KEYWORDS) {
                  val category = pair.first
                  val keywords = pair.second
                  if (keywords.any { label.contains(it) }) return category
              }
              return null
          }
          KT

      - name: Create view model
        run: |
          D=app/src/main/java/com/quart/home

          cat > $D/HomeViewModel.kt <<'KT'
          package com.quart.home
          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import java.util.UUID

          private val FOLDER_PALETTE = listOf(0xFF5B4DFFL, 0xFFFF6B6BL, 0xFFFFA94DL, 0xFF20C997L, 0xFF339AF0L, 0xFFCC5DE8L)

          data class HomeUiState(
              val loading: Boolean = true,
              val allApps: List<AppEntry> = emptyList(),
              val order: List<String> = emptyList(),
              val folders: Map<String, FolderData> = emptyMap(),
              val selectionMode: Boolean = false,
              val selectedKeys: Set<String> = emptySet(),
              val reorderMode: Boolean = false,
              val moveModeId: String? = null,
              val openFolderId: String? = null,
              val suggestions: List<Suggestion> = emptyList(),
              val showNewFolderDialog: Boolean = false,
              val showManageFolders: Boolean = false,
              val query: String = "",
              val message: String? = null
          ) {
              val appsByKey: Map<String, AppEntry> get() = allApps.associateBy { it.key }

              val topLevelItems: List<HomeItem> get() {
                  val byKey = appsByKey
                  return order.mapNotNull { id ->
                      if (id.startsWith("folder:")) {
                          val fid = id.removePrefix("folder:")
                          val f = folders[fid] ?: return@mapNotNull null
                          val previews = f.apps.mapNotNull { byKey[it] }
                          HomeItem.FolderSlot(fid, f, previews)
                      } else {
                          byKey[id]?.let { HomeItem.AppSlot(it) }
                      }
                  }
              }
          }

          class HomeViewModel(app: Application) : AndroidViewModel(app) {
              private val repo = AppRepository(app)
              private val store = LayoutStore(app)
              private var layout = LayoutData()

              private val _state = MutableStateFlow(HomeUiState())
              val state: StateFlow<HomeUiState> = _state.asStateFlow()

              init { refresh() }

              fun refresh() {
                  viewModelScope.launch {
                      _state.value = _state.value.copy(loading = true)
                      val apps = runCatching { repo.loadApps() }.getOrDefault(emptyList())
                      layout = store.load()

                      val validKeys = apps.map { it.key }.toSet()
                      layout.order.removeAll { id -> !id.startsWith("folder:") && id !in validKeys }
                      layout.folders.forEach { (_, f) -> f.apps.removeAll { it !in validKeys } }
                      layout.folders.entries.removeAll { it.value.apps.isEmpty() }
                      layout.order.removeAll { it.startsWith("folder:") && it.removePrefix("folder:") !in layout.folders }

                      val placedInFolders = layout.folders.values.flatMap { it.apps }.toSet()
                      val knownTopLevel = layout.order.filterNot { it.startsWith("folder:") }.toSet()
                      val missing = apps.map { it.key }.filter { it !in knownTopLevel && it !in placedInFolders }
                      layout.order.addAll(missing)

                      store.save(layout)
                      _state.value = _state.value.copy(loading = false, allApps = apps, order = layout.order.toList(), folders = layout.folders.toMap())
                  }
              }

              private fun persist() {
                  store.save(layout)
                  _state.value = _state.value.copy(order = layout.order.toList(), folders = layout.folders.toMap())
              }

              fun onQueryChange(v: String) { _state.value = _state.value.copy(query = v) }

              fun toggleReorderMode() {
                  val next = !_state.value.reorderMode
                  _state.value = _state.value.copy(
                      reorderMode = next,
                      moveModeId = null,
                      selectionMode = if (next) false else _state.value.selectionMode,
                      selectedKeys = if (next) emptySet() else _state.value.selectedKeys
                  )
              }

              fun onAppClick(entry: AppEntry) {
                  if (_state.value.reorderMode) { handleReorderTap(entry.key); return }
                  if (_state.value.selectionMode) { toggleSelect(entry.key); return }
                  if (!repo.launch(entry)) showMessage("Android a refuse de lancer " + entry.label)
              }

              fun onAppLongClick(entry: AppEntry) {
                  if (_state.value.reorderMode) return
                  if (_state.value.selectionMode) { toggleSelect(entry.key); return }
                  _state.value = _state.value.copy(selectionMode = true, selectedKeys = setOf(entry.key))
              }

              fun toggleSelect(key: String) {
                  val cur = _state.value.selectedKeys
                  val next = if (key in cur) cur - key else cur + key
                  _state.value = _state.value.copy(selectedKeys = next, selectionMode = next.isNotEmpty())
              }

              fun cancelSelection() {
                  _state.value = _state.value.copy(selectionMode = false, selectedKeys = emptySet())
              }

              fun openNewFolderDialog() { _state.value = _state.value.copy(showNewFolderDialog = true) }
              fun closeNewFolderDialog() { _state.value = _state.value.copy(showNewFolderDialog = false) }

              fun createFolderWithSelection(name: String, color: Long) {
                  val keys = _state.value.selectedKeys.toList()
                  if (keys.isEmpty() || name.isBlank()) return
                  val insertAt = layout.order.indexOf(keys.first()).let { if (it < 0) layout.order.size else it }
                  layout.order.removeAll(keys)
                  val id = UUID.randomUUID().toString().take(8)
                  layout.folders[id] = FolderData(name.trim(), color, keys.toMutableList())
                  layout.order.add(insertAt.coerceAtMost(layout.order.size), "folder:" + id)
                  cancelSelection()
                  closeNewFolderDialog()
                  persist()
              }

              fun addSelectionToFolder(folderId: String) {
                  val keys = _state.value.selectedKeys.toList()
                  if (keys.isEmpty()) return
                  val f = layout.folders[folderId] ?: return
                  layout.order.removeAll(keys)
                  f.apps.addAll(keys.filterNot { it in f.apps })
                  cancelSelection()
                  persist()
              }

              fun openFolder(folderId: String) { _state.value = _state.value.copy(openFolderId = folderId) }
              fun closeFolder() { _state.value = _state.value.copy(openFolderId = null) }

              fun removeAppFromFolder(folderId: String, appKey: String) {
                  val f = layout.folders[folderId] ?: return
                  f.apps.remove(appKey)
                  layout.order.add(appKey)
                  if (f.apps.isEmpty()) deleteFolderInternal(folderId)
                  persist()
              }

              fun renameFolder(folderId: String, newName: String) {
                  if (newName.isBlank()) return
                  layout.folders[folderId]?.name = newName.trim()
                  persist()
              }

              fun recolorFolder(folderId: String, color: Long) {
                  layout.folders[folderId]?.color = color
                  persist()
              }

              fun deleteFolder(folderId: String) {
                  deleteFolderInternal(folderId)
                  closeFolder()
                  persist()
              }

              private fun deleteFolderInternal(folderId: String) {
                  val f = layout.folders.remove(folderId) ?: return
                  val folderKey = "folder:" + folderId
                  val idx = layout.order.indexOf(folderKey).let { if (it < 0) layout.order.size else it }
                  layout.order.remove(folderKey)
                  layout.order.addAll(idx.coerceAtMost(layout.order.size), f.apps)
              }

              fun onFolderClick(folderId: String) {
                  if (_state.value.reorderMode) { handleReorderTap("folder:" + folderId); return }
                  if (_state.value.selectionMode) return
                  openFolder(folderId)
              }

              fun onFolderLongClick(folderId: String) {
                  // Non utilise en v1 : les dossiers ne se regroupent pas entre eux.
              }

              fun openManageFolders() { _state.value = _state.value.copy(showManageFolders = true) }
              fun closeManageFolders() { _state.value = _state.value.copy(showManageFolders = false) }

              fun moveAppToFolder(appKey: String, targetFolderId: String?) {
                  var sourceFolderId: String? = null
                  layout.folders.forEach { (id, f) -> if (appKey in f.apps) sourceFolderId = id }
                  if (sourceFolderId != null) {
                      layout.folders[sourceFolderId]?.apps?.remove(appKey)
                  } else {
                      layout.order.remove(appKey)
                  }
                  if (targetFolderId == null) {
                      if (appKey !in layout.order) layout.order.add(appKey)
                  } else {
                      val f = layout.folders[targetFolderId]
                      if (f != null && appKey !in f.apps) f.apps.add(appKey)
                  }
                  val emptied = sourceFolderId
                  if (emptied != null && layout.folders[emptied]?.apps?.isEmpty() == true) {
                      deleteFolderInternal(emptied)
                  }
                  persist()
              }

              private fun handleReorderTap(id: String) {
                  val current = _state.value.moveModeId
                  when {
                      current == null -> _state.value = _state.value.copy(moveModeId = id)
                      current == id -> _state.value = _state.value.copy(moveModeId = null)
                      else -> {
                          val from = layout.order.indexOf(current)
                          val to = layout.order.indexOf(id)
                          if (from >= 0 && to >= 0) {
                              layout.order[from] = id
                              layout.order[to] = current
                          }
                          _state.value = _state.value.copy(moveModeId = null)
                          persist()
                      }
                  }
              }

              fun computeSuggestions() {
                  val placedInFolder = layout.folders.values.flatMap { it.apps }.toSet()
                  val topLevelApps = layout.order.filterNot { it.startsWith("folder:") }
                      .mapNotNull { key -> _state.value.appsByKey[key] }
                  val groups = topLevelApps.filter { it.key !in placedInFolder }
                      .groupBy { guessCategory(it) }
                      .filterKeys { it != null }
                      .mapKeys { it.key!! }
                      .filterValues { it.size >= 2 }
                      .filterKeys { it !in layout.dismissedSuggestions }

                  val palette = FOLDER_PALETTE
                  val suggestions = groups.entries.mapIndexed { i, entry ->
                      Suggestion(entry.key, palette[i % palette.size], entry.value.map { it.key })
                  }
                  if (suggestions.isEmpty()) {
                      showMessage("Aucune suggestion pour le moment, tout semble deja bien range.")
                  }
                  _state.value = _state.value.copy(suggestions = suggestions)
              }

              fun acceptSuggestion(suggestion: Suggestion) {
                  val insertAt = layout.order.indexOf(suggestion.appKeys.first()).let { if (it < 0) layout.order.size else it }
                  layout.order.removeAll(suggestion.appKeys)
                  val id = UUID.randomUUID().toString().take(8)
                  layout.folders[id] = FolderData(suggestion.label, suggestion.color, suggestion.appKeys.toMutableList())
                  layout.order.add(insertAt.coerceAtMost(layout.order.size), "folder:" + id)
                  _state.value = _state.value.copy(suggestions = _state.value.suggestions - suggestion)
                  persist()
              }

              fun dismissSuggestion(suggestion: Suggestion) {
                  layout.dismissedSuggestions.add(suggestion.label)
                  _state.value = _state.value.copy(suggestions = _state.value.suggestions - suggestion)
                  store.save(layout)
              }

              fun clearSuggestions() { _state.value = _state.value.copy(suggestions = emptyList()) }

              fun consumeMessage() { _state.value = _state.value.copy(message = null) }
              private fun showMessage(text: String) { _state.value = _state.value.copy(message = text) }
          }
          KT

      - name: Create UI
        run: |
          D=app/src/main/java/com/quart/home

          cat > $D/MainActivity.kt <<'KT'
          package com.quart.home
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.viewModels
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.combinedClickable
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.lifecycle.compose.collectAsStateWithLifecycle

          private val Violet = Color(0xFF5B4DFF)
          private val Palette = listOf(0xFF5B4DFFL, 0xFFFF6B6BL, 0xFFFFA94DL, 0xFF20C997L, 0xFF339AF0L, 0xFFCC5DE8L)

          class MainActivity : ComponentActivity() {
              private val vm: HomeViewModel by viewModels()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { MaterialTheme(colorScheme = darkColorScheme(primary = Violet)) { HomeScreen(vm) } }
              }
              override fun onResume() { super.onResume(); vm.refresh() }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun HomeScreen(vm: HomeViewModel) {
              val state by vm.state.collectAsStateWithLifecycle()
              val context = LocalContext.current

              LaunchedEffect(state.message) {
                  state.message?.let { Toast.makeText(context, it, Toast.LENGTH_SHORT).show(); vm.consumeMessage() }
              }

              val items = remember(state.order, state.folders, state.allApps, state.query) {
                  val all = state.topLevelItems
                  if (state.query.isBlank()) all else all.filter { item ->
                      when (item) {
                          is HomeItem.AppSlot -> item.app.label.contains(state.query, true)
                          is HomeItem.FolderSlot -> item.data.name.contains(state.query, true) ||
                              item.previewApps.any { it.label.contains(state.query, true) }
                      }
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  Column(
                      Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.45f)).systemBarsPadding().padding(horizontal = 16.dp)
                  ) {
                      Spacer(Modifier.height(12.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Text("Quart Home", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                              Text(state.allApps.size.toString() + " applications", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                          }
                          TextButton(onClick = {
                              runCatching {
                                  context.startActivity(Intent(Settings.ACTION_HOME_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              }
                          }) { Text("Quitter", color = Color.White) }
                      }

                      Spacer(Modifier.height(4.dp))

                      Row {
                          TextButton(onClick = { vm.computeSuggestions() }) { Text("Optimiser", color = Color.White) }
                          TextButton(onClick = { vm.openManageFolders() }) { Text("Dossiers", color = Color.White) }
                          TextButton(onClick = { vm.toggleReorderMode() }) {
                              Text(if (state.reorderMode) "Termine" else "Deplacer", color = if (state.reorderMode) Violet else Color.White)
                          }
                      }

                      Spacer(Modifier.height(10.dp))

                      TextField(
                          value = state.query,
                          onValueChange = { vm.onQueryChange(it) },
                          placeholder = { Text("Rechercher") },
                          singleLine = true,
                          shape = RoundedCornerShape(28.dp),
                          colors = TextFieldDefaults.colors(focusedIndicatorColor = Color.Transparent, unfocusedIndicatorColor = Color.Transparent),
                          modifier = Modifier.fillMaxWidth()
                      )

                      if (state.reorderMode) {
                          Spacer(Modifier.height(8.dp))
                          val txt = if (state.moveModeId == null) "Touchez une icone a deplacer" else "Touchez la destination"
                          Box(
                              Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(Violet.copy(alpha = 0.85f)).padding(12.dp)
                          ) { Text(txt, color = Color.White, fontSize = 13.sp) }
                      }

                      Spacer(Modifier.height(10.dp))

                      when {
                          state.loading && state.allApps.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              CircularProgressIndicator(color = Color.White)
                          }
                          items.isEmpty() -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                              Text("Aucun resultat.", color = Color.White.copy(alpha = 0.7f))
                          }
                          else -> LazyVerticalGrid(
                              columns = GridCells.Fixed(4),
                              contentPadding = PaddingValues(bottom = 100.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalArrangement = Arrangement.spacedBy(16.dp)
                          ) {
                              items(items, key = { it.id }) { item ->
                                  when (item) {
                                      is HomeItem.AppSlot -> AppTile(
                                          app = item.app,
                                          highlighted = state.reorderMode && state.moveModeId == item.id,
                                          selected = item.id in state.selectedKeys,
                                          selectionMode = state.selectionMode,
                                          onClick = { vm.onAppClick(item.app) },
                                          onLongClick = { vm.onAppLongClick(item.app) }
                                      )
                                      is HomeItem.FolderSlot -> FolderTile(
                                          item = item,
                                          highlighted = state.reorderMode && state.moveModeId == item.id,
                                          onClick = { vm.onFolderClick(item.folderId) },
                                          onLongClick = { vm.onFolderLongClick(item.folderId) }
                                      )
                                  }
                              }
                          }
                      }
                  }

                  if (state.selectionMode) {
                      Row(
                          Modifier.align(Alignment.BottomCenter).fillMaxWidth()
                              .background(Color(0xFF1A1A2E)).systemBarsPadding().padding(16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(state.selectedKeys.size.toString() + " selectionne(s)", color = Color.White, modifier = Modifier.weight(1f))
                          TextButton(onClick = { vm.cancelSelection() }) { Text("Annuler", color = Color.White.copy(alpha = 0.7f)) }
                          Button(onClick = { vm.openNewFolderDialog() }, colors = ButtonDefaults.buttonColors(containerColor = Violet)) {
                              Text("Ajouter au dossier")
                          }
                      }
                  }
              }

              if (state.showNewFolderDialog) {
                  NewFolderDialog(
                      existingFolders = state.folders,
                      onCreate = { name, color -> vm.createFolderWithSelection(name, color) },
                      onAddExisting = { id -> vm.addSelectionToFolder(id) },
                      onDismiss = { vm.closeNewFolderDialog() }
                  )
              }

              val openFid = state.openFolderId
              if (openFid != null) {
                  val folder = state.folders[openFid]
                  if (folder != null) {
                      FolderDialog(
                          folder = folder,
                          apps = folder.apps.mapNotNull { state.appsByKey[it] },
                          onLaunch = { app -> vm.onAppClick(app) },
                          onRemove = { key -> vm.removeAppFromFolder(openFid, key) },
                          onRename = { name -> vm.renameFolder(openFid, name) },
                          onRecolor = { color -> vm.recolorFolder(openFid, color) },
                          onDelete = { vm.deleteFolder(openFid) },
                          onDismiss = { vm.closeFolder() }
                      )
                  }
              }

              if (state.suggestions.isNotEmpty()) {
                  SuggestionsDialog(
                      suggestions = state.suggestions,
                      onAccept = { vm.acceptSuggestion(it) },
                      onDismissOne = { vm.dismissSuggestion(it) },
                      onClose = { vm.clearSuggestions() }
                  )
              }

              if (state.showManageFolders) {
                  val homeApps = state.order.filterNot { it.startsWith("folder:") }.mapNotNull { state.appsByKey[it] }
                  ManageFoldersDialog(
                      folders = state.folders,
                      homeApps = homeApps,
                      appsByKey = state.appsByKey,
                      onMove = { key, target -> vm.moveAppToFolder(key, target) },
                      onDismiss = { vm.closeManageFolders() }
                  )
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun AppTile(
              app: AppEntry,
              highlighted: Boolean,
              selected: Boolean,
              selectionMode: Boolean,
              onClick: () -> Unit,
              onLongClick: () -> Unit
          ) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier
                      .clip(RoundedCornerShape(16.dp))
                      .then(if (highlighted) Modifier.border(2.dp, Color.White, RoundedCornerShape(16.dp)) else Modifier)
                      .combinedClickable(onClick = onClick, onLongClick = onLongClick)
                      .padding(vertical = 8.dp, horizontal = 4.dp)
              ) {
                  Box(contentAlignment = Alignment.TopEnd) {
                      if (app.icon != null) {
                          Image(bitmap = app.icon, contentDescription = app.label, modifier = Modifier.size(52.dp))
                      } else {
                          Box(Modifier.size(52.dp).clip(RoundedCornerShape(14.dp)).background(Color.White.copy(alpha = 0.2f)))
                      }
                      if (selectionMode) {
                          Box(
                              Modifier.size(18.dp).clip(CircleShape)
                                  .background(if (selected) Violet else Color.White.copy(alpha = 0.3f))
                          )
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  Text(app.label, color = Color.White, fontSize = 11.sp, maxLines = 2, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center, lineHeight = 13.sp)
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun FolderTile(item: HomeItem.FolderSlot, highlighted: Boolean, onClick: () -> Unit, onLongClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier
                      .clip(RoundedCornerShape(16.dp))
                      .then(if (highlighted) Modifier.border(2.dp, Color.White, RoundedCornerShape(16.dp)) else Modifier)
                      .combinedClickable(onClick = onClick, onLongClick = onLongClick)
                      .padding(vertical = 8.dp, horizontal = 4.dp)
              ) {
                  Box(
                      Modifier.size(52.dp).clip(RoundedCornerShape(14.dp)).background(Color(item.data.color)),
                      contentAlignment = Alignment.Center
                  ) {
                      Column {
                          Row {
                              FolderMiniIcon(item.previewApps.getOrNull(0))
                              Spacer(Modifier.width(2.dp))
                              FolderMiniIcon(item.previewApps.getOrNull(1))
                          }
                          Spacer(Modifier.height(2.dp))
                          Row {
                              FolderMiniIcon(item.previewApps.getOrNull(2))
                              Spacer(Modifier.width(2.dp))
                              FolderMiniIcon(item.previewApps.getOrNull(3))
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  Text(item.data.name, color = Color.White, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
              }
          }

          @Composable
          private fun FolderMiniIcon(app: AppEntry?) {
              if (app != null && app.icon != null) {
                  Image(bitmap = app.icon, contentDescription = null, modifier = Modifier.size(18.dp))
              } else {
                  Box(Modifier.size(18.dp))
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun NewFolderDialog(
              existingFolders: Map<String, FolderData>,
              onCreate: (String, Long) -> Unit,
              onAddExisting: (String) -> Unit,
              onDismiss: () -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var color by remember { mutableStateOf(Palette.first()) }

              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.clip(RoundedCornerShape(20.dp)).background(Color(0xFF1A1A2E)).padding(20.dp)
                  ) {
                      Text("Ajouter au dossier", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(12.dp))

                      if (existingFolders.isNotEmpty()) {
                          Text("Dossier existant", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                          Spacer(Modifier.height(6.dp))
                          existingFolders.forEach { (id, f) ->
                              Row(
                                  Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp))
                                      .combinedClickable(onClick = { onAddExisting(id) }, onLongClick = {})
                                      .padding(vertical = 8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Box(Modifier.size(20.dp).clip(CircleShape).background(Color(f.color)))
                                  Spacer(Modifier.width(10.dp))
                                  Text(f.name, color = Color.White)
                              }
                          }
                          Spacer(Modifier.height(12.dp))
                          Text("ou creer un nouveau dossier", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                          Spacer(Modifier.height(6.dp))
                      }

                      TextField(
                          value = name,
                          onValueChange = { name = it },
                          placeholder = { Text("Nom du dossier") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(10.dp))
                      Row {
                          Palette.forEach { c ->
                              Box(
                                  Modifier.size(28.dp).clip(CircleShape).background(Color(c))
                                      .then(if (c == color) Modifier.border(2.dp, Color.White, CircleShape) else Modifier)
                                      .combinedClickable(onClick = { color = c }, onLongClick = {})
                              )
                              Spacer(Modifier.width(8.dp))
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          TextButton(onClick = onDismiss) { Text("Annuler", color = Color.White.copy(alpha = 0.7f)) }
                          Spacer(Modifier.width(8.dp))
                          Button(
                              onClick = { if (name.isNotBlank()) onCreate(name, color) },
                              colors = ButtonDefaults.buttonColors(containerColor = Violet)
                          ) { Text("Creer") }
                      }
                  }
              }
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun FolderDialog(
              folder: FolderData,
              apps: List<AppEntry>,
              onLaunch: (AppEntry) -> Unit,
              onRemove: (String) -> Unit,
              onRename: (String) -> Unit,
              onRecolor: (Long) -> Unit,
              onDelete: () -> Unit,
              onDismiss: () -> Unit
          ) {
              var editingName by remember { mutableStateOf(false) }
              var nameField by remember { mutableStateOf(folder.name) }

              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.clip(RoundedCornerShape(20.dp)).background(Color(0xFF1A1A2E)).padding(20.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          if (editingName) {
                              TextField(
                                  value = nameField, onValueChange = { nameField = it }, singleLine = true,
                                  modifier = Modifier.weight(1f)
                              )
                              TextButton(onClick = { onRename(nameField); editingName = false }) { Text("OK") }
                          } else {
                              Text(folder.name, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                              TextButton(onClick = { editingName = true }) { Text("Renommer", color = Color.White.copy(alpha = 0.7f)) }
                          }
                      }
                      Spacer(Modifier.height(8.dp))
                      Row {
                          Palette.forEach { c ->
                              Box(
                                  Modifier.size(24.dp).clip(CircleShape).background(Color(c))
                                      .then(if (c == folder.color) Modifier.border(2.dp, Color.White, CircleShape) else Modifier)
                                      .combinedClickable(onClick = { onRecolor(c) }, onLongClick = {})
                              )
                              Spacer(Modifier.width(6.dp))
                          }
                      }
                      Spacer(Modifier.height(14.dp))

                      if (apps.isEmpty()) {
                          Text("Ce dossier est vide.", color = Color.White.copy(alpha = 0.6f))
                      } else {
                          LazyVerticalGrid(
                              columns = GridCells.Fixed(4),
                              modifier = Modifier.heightIn(max = 280.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              items(apps, key = { it.key }) { app ->
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      modifier = Modifier.combinedClickable(onClick = { onLaunch(app) }, onLongClick = { onRemove(app.key) })
                                  ) {
                                      if (app.icon != null) Image(bitmap = app.icon, contentDescription = app.label, modifier = Modifier.size(44.dp))
                                      else Box(Modifier.size(44.dp).clip(RoundedCornerShape(12.dp)).background(Color.White.copy(alpha = 0.2f)))
                                      Text(app.label, color = Color.White, fontSize = 10.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                          Text("Appui long pour retirer du dossier", color = Color.White.copy(alpha = 0.5f), fontSize = 11.sp)
                      }

                      Spacer(Modifier.height(14.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          TextButton(onClick = onDelete) { Text("Supprimer le dossier", color = Color(0xFFFF6B6B)) }
                          TextButton(onClick = onDismiss) { Text("Fermer", color = Color.White) }
                      }
                  }
              }
          }

          @Composable
          private fun SuggestionsDialog(
              suggestions: List<Suggestion>,
              onAccept: (Suggestion) -> Unit,
              onDismissOne: (Suggestion) -> Unit,
              onClose: () -> Unit
          ) {
              Dialog(onDismissRequest = onClose) {
                  Column(
                      Modifier.clip(RoundedCornerShape(20.dp)).background(Color(0xFF1A1A2E)).padding(20.dp)
                  ) {
                      Text(suggestions.size.toString() + " suggestion(s)", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(6.dp))
                      Text("Base sur des mots-cles locaux, pas une vraie IA.", color = Color.White.copy(alpha = 0.5f), fontSize = 11.sp)
                      Spacer(Modifier.height(12.dp))
                      suggestions.forEach { s ->
                          Row(
                              Modifier.fillMaxWidth().padding(vertical = 8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(Modifier.size(14.dp).clip(CircleShape).background(Color(s.color)))
                              Spacer(Modifier.width(8.dp))
                              Text("Regrouper " + s.label + " (" + s.appKeys.size + ")", color = Color.White, modifier = Modifier.weight(1f), fontSize = 13.sp)
                              TextButton(onClick = { onDismissOne(s) }) { Text("Ignorer", color = Color.White.copy(alpha = 0.5f)) }
                              Button(onClick = { onAccept(s) }, colors = ButtonDefaults.buttonColors(containerColor = Violet)) { Text("Creer") }
                          }
                      }
                      Spacer(Modifier.height(10.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          TextButton(onClick = onClose) { Text("Fermer", color = Color.White) }
                      }
                  }
              }
          }

          @Composable
          private fun ManageFoldersDialog(
              folders: Map<String, FolderData>,
              homeApps: List<AppEntry>,
              appsByKey: Map<String, AppEntry>,
              onMove: (String, String?) -> Unit,
              onDismiss: () -> Unit
          ) {
              var movingApp by remember { mutableStateOf<AppEntry?>(null) }

              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.clip(RoundedCornerShape(20.dp)).background(Color(0xFF1A1A2E))
                          .heightIn(max = 560.dp).padding(20.dp)
                  ) {
                      Text("Gerer les dossiers", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(4.dp))
                      Text("Touchez une application pour la deplacer", color = Color.White.copy(alpha = 0.5f), fontSize = 11.sp)
                      Spacer(Modifier.height(12.dp))

                      Column(Modifier.weight(1f, fill = false).verticalScroll(rememberScrollState())) {
                          folders.forEach { (id, f) ->
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(top = 10.dp, bottom = 4.dp)) {
                                  Box(Modifier.size(12.dp).clip(CircleShape).background(Color(f.color)))
                                  Spacer(Modifier.width(8.dp))
                                  Text(f.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                              }
                              f.apps.mapNotNull { appsByKey[it] }.forEach { app ->
                                  ManageAppRow(app) { movingApp = app }
                              }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(top = 14.dp, bottom = 4.dp)) {
                              Text("Ecran d'accueil", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                          }
                          homeApps.forEach { app -> ManageAppRow(app) { movingApp = app } }
                      }

                      Spacer(Modifier.height(12.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          TextButton(onClick = onDismiss) { Text("Fermer", color = Color.White) }
                      }
                  }
              }

              val app = movingApp
              if (app != null) {
                  MoveAppDialog(
                      appLabel = app.label,
                      folders = folders,
                      onPick = { target -> onMove(app.key, target); movingApp = null },
                      onDismiss = { movingApp = null }
                  )
              }
          }

          @Composable
          private fun ManageAppRow(app: AppEntry, onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp))
                      .clickable { onClick() }
                      .padding(vertical = 8.dp, horizontal = 4.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (app.icon != null) Image(bitmap = app.icon, contentDescription = null, modifier = Modifier.size(28.dp))
                  else Box(Modifier.size(28.dp).clip(RoundedCornerShape(8.dp)).background(Color.White.copy(alpha = 0.2f)))
                  Spacer(Modifier.width(10.dp))
                  Text(app.label, color = Color.White, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
              }
          }

          @Composable
          private fun MoveAppDialog(
              appLabel: String,
              folders: Map<String, FolderData>,
              onPick: (String?) -> Unit,
              onDismiss: () -> Unit
          ) {
              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.clip(RoundedCornerShape(20.dp)).background(Color(0xFF1A1A2E)).padding(20.dp)
                  ) {
                      Text("Deplacer " + appLabel, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(12.dp))
                      Row(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp)).clickable { onPick(null) }.padding(vertical = 10.dp)
                      ) { Text("Ecran d'accueil", color = Color.White) }
                      folders.forEach { (id, f) ->
                          Row(
                              Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp)).clickable { onPick(id) }.padding(vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(Modifier.size(14.dp).clip(CircleShape).background(Color(f.color)))
                              Spacer(Modifier.width(8.dp))
                              Text(f.name, color = Color.White)
                          }
                      }
                      Spacer(Modifier.height(10.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                          TextButton(onClick = onDismiss) { Text("Annuler", color = Color.White.copy(alpha = 0.7f)) }
                      }
                  }
              }
          }
          KT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/QuartHome.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
